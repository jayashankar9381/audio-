<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI వాయిస్ ఓవర్ & PDF టూ ఆడియో స్టూడియో</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PDF టెక్స్ట్ చదవడానికి లిబ్ (PDF.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 p-6 md:p-8 space-y-6">
        <div class="text-center space-y-2">
            <span class="bg-indigo-500/10 text-indigo-400 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider border border-indigo-500/20">ఎలెవెన్‌లాబ్స్ స్టైల్ AI స్టూడియో</span>
            <h1 class="text-2xl font-extrabold text-white">టెక్స్ట్ & PDF నుండి సహజమైన వాయిస్ ఓవర్</h1>
            <p class="text-xs text-slate-400">PDF ఫైల్ అప్‌లోడ్ చేయండి లేదా టెక్స్ట్ ఇవ్వండి, 10+ విభిన్న వాయిస్‌లలో ఆడియో పొందండి.</p>
        </div>

        <div class="space-y-4">
            <!-- PDF Upload Box -->
            <div class="border-2 border-dashed border-slate-600 rounded-2xl p-4 text-center hover:border-indigo-500 transition bg-slate-900/50">
                <input type="file" id="pdf-file-input" accept=".pdf" class="hidden" onchange="handlePdfUpload(event)">
                <label for="pdf-file-input" class="cursor-pointer flex flex-col items-center space-y-1">
                    <i data-lucide="file-text" class="w-8 h-8 text-indigo-400"></i>
                    <span class="text-xs font-bold text-slate-300" id="pdf-label-text">PDF ఫైల్ అప్‌లోడ్ చేయడానికి ఇక్కడ క్లిక్ చేయండి</span>
                    <span class="text-[10px] text-slate-500">(లేదా క్రింద టెక్స్ట్ టైప్ చేయవచ్చు)</span>
                </label>
            </div>

            <!-- Text Input -->
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">మీ టెక్స్ట్ (Text / PDF Content):</label>
                <textarea id="source-text" rows="4" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-2xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter text or upload PDF to read..."></textarea>
            </div>

            <!-- Language & Voice Selection Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Language Selector -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">భాష (Language):</label>
                    <select id="target-language" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-2xl text-sm font-semibold text-slate-200">
                        <option value="te">తెలుగు (Telugu)</option>
                        <option value="hi">हिंदी (Hindi)</option>
                        <option value="en">English (US)</option>
                        <option value="ta">தமிழ் (Tamil)</option>
                        <option value="kn">ಕನ್ನಡ (Kannada)</option>
                        <option value="ml">മലയാളം (Malayalam)</option>
                    </select>
                </div>

                <!-- 10 Voice Styles Selector -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">వాయిస్ స్టైల్ (10 Voice Options):</label>
                    <select id="voice-style" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-2xl text-sm font-semibold text-indigo-300">
                        <!-- Male Voices -->
                        <optgroup label="పురుష గొంతుకలు (Male Voices)">
                            <option value="male-1">రాహుల్ - ప్రశాంతమైన గొంతు (Calm Male)</option>
                            <option value="male-2">అరుణ్ - ప్రొఫెషనల్ / న్యూస్ (Professional Male)</option>
                            <option value="male-3">విజయ్ - ఉత్సాహంగా (Energetic Male)</option>
                            <option value="male-4">కిరణ్ - ముసలి/గంభీరమైన గొంతు (Deep/Mature Male)</option>
                            <option value="male-5">అనిల్ - స్టోరీ టెల్లర్ (Storyteller Male)</option>
                        </optgroup>
                        <!-- Female Voices -->
                        <optgroup label="స్త్రీ గొంతుకలు (Female Voices)">
                            <option value="female-1">ప్రియా - మృదువైన గొంతు (Soft Female)</option>
                            <option value="female-2">దివ్య - ప్రొఫెషనల్ / కార్పొరేట్ (Corporate Female)</option>
                            <option value="female-3">అన్విత - స్నేహపూర్వక గొంతు (Friendly Female)</option>
                            <option value="female-4">స్వాతి - నవలా రచయిత/కథకి (Narrator Female)</option>
                            <option value="female-5">మేఘన - ఉత్సాహభరితమైన గొంతు (Vibrant Female)</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <!-- Generate Button -->
            <button onclick="generateVoice()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-sm shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2">
                <i data-lucide="mic" class="w-4 h-4"></i> ఆడియోగా మార్చండి (Generate Voice)
            </button>
        </div>

        <!-- Audio Output Player Box -->
        <div id="player-box" class="hidden bg-slate-950 text-white p-5 rounded-2xl space-y-3 border border-slate-800">
            <div class="flex items-center justify-between">
                <span class="text-xs text-indigo-400 font-semibold flex items-center gap-1">
                    <i data-lucide="volume-2" class="w-4 h-4"></i> వాయిస్ సిద్ధంగా ఉంది
                </span>
                <span id="voice-indicator" class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded-full font-bold">Voice</span>
            </div>
            
            <p id="output-preview-text" class="text-xs text-slate-400 italic"></p>

            <div class="flex items-center gap-3 pt-2">
                <button id="play-pause-btn" onclick="togglePlayAudio()" class="p-3 bg-indigo-600 hover:bg-indigo-700 rounded-xl transition">
                    <i data-lucide="play" class="w-5 h-5"></i>
                </button>
                <div class="flex-1 bg-slate-800 h-2 rounded-full overflow-hidden">
                    <div id="audio-progress" class="bg-indigo-500 h-full w-0 transition-all duration-300"></div>
                </div>
                <button onclick="downloadAudioNotification()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl transition flex items-center gap-1 text-slate-200">
                    <i data-lucide="download" class="w-4 h-4"></i> సేవ్ / డౌన్‌లోడ్
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // PDF రీడర్ లాజిక్ (PDF.js ఉపయోగించి టెక్స్ట్ ఎక్స్‌ట్రాక్ట్ చేయడం)
        function handlePdfUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('pdf-label-text').innerText = `ఫైల్ ఎంచుకోబడింది: ${file.name}`;

            const reader = new FileReader();
            reader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                
                try {
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullText = "";
                    
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(" ");
                        fullText += pageText + "\n";
                    }

                    document.getElementById('source-text').value = fullText.trim();
                    alert('PDF నుండి టెక్స్ట్ വിജയవంతంగా రీడ్ చేయబడింది!');
                } catch (error) {
                    alert('PDF ఫైల్ చదవడం లో లోపం ఏర్పడింది.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        let isPlaying = false;

        function generateVoice() {
            const text = document.getElementById('source-text').value;
            const lang = document.getElementById('target-language').value;
            const voiceStyle = document.getElementById('voice-style').value;

            if (!text.trim()) {
                alert('దయచేసి ముందుగా PDF అప్‌లోడ్ చేయండి లేదా టెక్స్ట్ ఎంటర్ చేయండి!');
                return;
            }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang === 'te' ? 'te-IN' : (lang === 'hi' ? 'hi-IN' : 'en-US');
                
                // 10 రకాల వాయిస్‌లకు తగినట్లు పిచ్ (Pitch) మరియు స్పీడ్ (Rate) మార్పులు
                if (voiceStyle.includes('female')) {
                    utterance.pitch = 1.3; // స్త్రీ గొంతు కోసం హై పిచ్
                } else {
                    utterance.pitch = 0.8; // పురుష గొంతు కోసం లో పిచ్
                }

                if (voiceStyle === 'male-3' || voiceStyle === 'female-5') {
                    utterance.rate = 1.1; // ఉత్సాహంగా ఉండేందుకు కొద్దిగా వేగం
                } else if (voiceStyle === 'male-4') {
                    utterance.rate = 0.85; // గంభీరంగా మెల్లగా
                } else {
                    utterance.rate = 0.95; // సాధారణ సహజ వేగం
                }

                // UI అప్‌డేట్
                document.getElementById('player-box').classList.remove('hidden');
                document.getElementById('output-preview-text').innerText = `"${text.substring(0, 90)}..."`;
                document.getElementById('voice-indicator').innerText = voiceStyle.toUpperCase();

                utterance.onstart = () => {
                    isPlaying = true;
                    document.getElementById('audio-progress').style.width = '100%';
                    document.querySelector('#play-pause-btn i').setAttribute('data-lucide', 'pause');
                    lucide.createIcons();
                };

                utterance.onend = () => {
                    isPlaying = false;
                    document.getElementById('audio-progress').style.width = '0%';
                    document.querySelector('#play-pause-btn i').setAttribute('data-lucide', 'play');
                    lucide.createIcons();
                };

                window.speechSynthesis.speak(utterance);
            } else {
                alert('మీ బ్రౌజర్ వాయిస్ సింథసిస్‌ని సపోర్ట్ చేయదు.');
            }
        }

        function togglePlayAudio() {
            if (window.speechSynthesis.speaking) {
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                } else {
                    window.speechSynthesis.pause();
                }
            } else {
                generateVoice();
            }
        }

        function downloadAudioNotification() {
            alert('ఆడియో ప్రాసెస్ పూర్తయింది! దీన్ని సర్వర్ సైడ్ ఆడియో ఎన్‌కోడర్ ద్వారా .mp3 ఫైల్‌గా డౌన్‌లోడ్ చేసుకోవచ్చు.');
        }
    </script>
</body>
</html>
