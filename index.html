<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ఆన్‌లైన్ టెక్నికల్ ఇన్‌స్టిట్యూట్</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; text-align: center; }
        .course-grid { display: flex; gap: 15px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .course-btn { padding: 15px 25px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .course-btn:hover { background: #0056b3; }
        .locked-section { background: #fff3cd; padding: 20px; border: 1px solid #ffeeba; margin-top: 20px; border-radius: 5px; text-align: center; }
        .unlocked-section { background: #d4edda; padding: 20px; border: 1px solid #c3e6cb; margin-top: 20px; border-radius: 5px; }
        .admin-box { background: #e2e3e5; padding: 15px; margin-top: 30px; border-radius: 5px; }
        input, button { padding: 10px; margin: 5px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>ఆన్‌లైన్ కోర్సులు</h1>
    <p style="text-align: center;">కింది కోర్సుల్లో ఒకదానిని ఎంచుకోండి:</p>

    <!-- కోర్సుల బటన్లు -->
    <div class="course-grid">
        <button class="course-btn" onclick="selectCourse('HTML')">HTML</button>
        <button class="course-btn" onclick="selectCourse('CSS')">CSS</button>
        <button class="course-btn" onclick="selectCourse('Python')">Python</button>
        <button class="course-btn" onclick="selectCourse('Java')">Java</button>
    </div>

    <div id="course-content" style="margin-top: 30px;"></div>

    <!-- ఓనర్ అడ్మిన్ ప్యానెల్ -->
    <div class="admin-box">
        <h3>ఓనర్ లాగిన్ & వీడియో లింక్ సెటప్</h3>
        <div id="owner-login-section">
            <input type="text" id="owner-whatsapp" placeholder="వాట్సాప్ నెంబర్ ఎంటర్ చేయండి">
            <button onclick="ownerLogin()">లాగిన్ అవ్వండి</button>
        </div>
        <div id="owner-dashboard" style="display:none;">
            <p style="color: green; font-weight: bold;">✔ ఓనర్‌గా లాగిన్ అయ్యారు</p>
            <select id="target-course">
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
            </select>
            <input type="text" id="yt-link" placeholder="YouTube లింక్ ఇక్కడ పేస్ట్ చేయండి">
            <button onclick="saveYoutubeLink()">లింక్ సేవ్ చేయి</button>
        </div>
    </div>
</div>

<script>
    // డేటా స్టోరేజ్ కోసం
    let courseData = {
        'HTML': { link: '', unlocked: false },
        'CSS': { link: '', unlocked: false },
        'Python': { link: '', unlocked: false },
        'Java': { link: '', unlocked: false }
    };

    let currentCourse = '';

    function selectCourse(courseName) {
        currentCourse = courseName;
        let contentDiv = document.getElementById('course-content');
        
        let data = courseData[courseName];

        if (data.unlocked) {
            // వీడియో అన్‌లాక్ అయితే చూపించు
            contentDiv.innerHTML = `
                <div class="unlocked-section">
                    <h2>${courseName} కోర్సు వీడియోలు (அన్‌లాక్ చేయబడ్డాయి 🔓)</h2>
                    ${data.link ? `<p><a href="${data.link}" target="_blank">👉 ఇక్కడ క్లిక్ చేసి వీడియో చూడండి</a></p>` : '<p>త్వరలో వీడియో అప్‌డేట్ చేయబడుతుంది.</p>'}
                </div>
            `;
        } else {
            // లాక్ అయి ఉంటే పేమెంట్ ఆప్షన్స్ చూపించు
            contentDiv.innerHTML = `
                <div class="locked-section">
                    <h2>${courseName} కోర్సు లాక్ చేయబడింది 🔒</h2>
                    <p>వీడియోలు చూడటానికి క్రింది ప్లాన్‌లలో ఒకటి ఎంచుకుని పేమెంట్ చేయండి:</p>
                    <label><input type="radio" name="plan" value="1500" checked> రూ. 1500/- (1 నెల సర్టిఫికెట్ ప్లాన్)</label><br>
                    <label><input type="radio" name="plan" value="3000"> రూ. 3000/- (2 నెలల సర్టిఫికెట్ ప్లాన్)</label><br><br>
                    <button onclick="makePayment()" style="background: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px;">పేమెంట్ పూర్తి చేయి (Pay Now)</button>
                </div>
            `;
        }
    }

    function makePayment() {
        alert("పేమెంట్ విజయవంతమైంది! వీడియోలు అన్‌లాక్ చేయబడ్డాయి.");
        courseData[currentCourse].unlocked = true;
        selectCourse(currentCourse);
    }

    function ownerLogin() {
        let wpNumber = document.getElementById('owner-whatsapp').value;
        if(wpNumber.trim() !== '') {
            document.getElementById('owner-login-section').style.display = 'none';
            document.getElementById('owner-dashboard').style.display = 'block';
        } else {
            alert('దయచేసి వాట్సాప్ నెంబర్ ఇవ్వండి.');
        }
    }

    function saveYoutubeLink() {
        let select = document.getElementById('target-course').value;
        let link = document.getElementById('yt-link').value;
        if(link.trim() !== '') {
            courseData[select].link = link;
            alert(select + " కోర్సుకు YouTube లింక్ విజయవంతంగా సేవ్ చేయబడింది!");
            document.getElementById('yt-link').value = '';
        } else {
            alert('దయచేసి సరైన లింక్ ఇవ్వండి.');
        }
    }
</script>

</body>
</html>
