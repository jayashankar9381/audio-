<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Audio Book Studio & E-Book Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        @media print { body { display: none !important; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans no-select" oncontextmenu="return false;">

    <!-- Top Navigation -->
    <nav class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showCustomerView()">
                <i data-lucide="book-open-check" class="text-indigo-500 w-7 h-7"></i>
                <h1 class="text-xl font-extrabold text-white">AI E-Book Studio</h1>
            </div>
            
            <div class="flex gap-2">
                <button onclick="showCustomerView()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold transition flex items-center gap-1">
                    <i data-lucide="store" class="w-4 h-4"></i> Customer Store
                </button>
                <button onclick="showOwnerLogin()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1 shadow-md shadow-indigo-600/30">
                    <i data-lucide="shield-check" class="w-4 h-4"></i> Owner Portal
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-4 md:p-8">

        <!-- OWNER LOGIN VIEW -->
        <section id="owner-login-view" class="hidden max-w-md mx-auto bg-slate-900 p-6 md:p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <h2 class="text-2xl font-bold text-white">Owner Portal Login</h2>
                <p class="text-xs text-slate-400">Enter your secure credentials</p>
            </div>

            <form onsubmit="event.preventDefault(); handleOwnerLogin();" class="space-y-4" autocomplete="off">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Owner Email</label>
                    <input type="email" id="owner-email" placeholder="Email" autocomplete="off" class="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">PIN / Password</label>
                    <input type="password" id="owner-pass" placeholder="Password" autocomplete="new-password" class="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm outline-none">
                </div>

                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 font-bold rounded-xl text-sm transition shadow-lg shadow-indigo-600/30">
                    Login to Dashboard
                </button>
            </form>
        </section>

        <!-- OWNER DASHBOARD VIEW -->
        <section id="owner-dashboard-view" class="hidden space-y-8">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-white">Owner Management Board</h2>
                    <p class="text-xs text-slate-400">Upload / Delete books and view live readers count</p>
                </div>
                <button onclick="showCustomerView()" class="px-3 py-1.5 bg-red-500/20 text-red-400 text-xs font-bold rounded-lg border border-red-500/30">Exit Board</button>
            </div>

            <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4">
                <h3 class="text-lg font-bold text-indigo-400 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5"></i> Publish New Book Live
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Book Title</label>
                        <input type="text" id="book-title" placeholder="e.g. AI Revolution 2026" class="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Price (₹)</label>
                        <input type="number" id="book-price" placeholder="199" class="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Cover Image File</label>
                        <input type="file" id="book-image-file" accept="image/*" class="w-full p-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Owner UPI ID</label>
                        <input type="text" id="book-upi-id" placeholder="jayashankar9381@ybl" value="jayashankar9381@ybl" class="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Book Content / Summary</label>
                    <textarea id="book-content" rows="4" placeholder="Enter book content here..." class="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm"></textarea>
                </div>

                <button onclick="saveBook()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 font-bold rounded-xl text-sm transition shadow-lg shadow-indigo-600/30">
                    Publish Book Live (Sync to All Devices)
                </button>
            </div>

            <div class="space-y-4">
                <h3 class="text-lg font-bold text-white">Published Books & Readers Count</h3>
                <div id="owner-books-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </section>

        <!-- CUSTOMER STORE VIEW -->
        <section id="customer-store-view" class="space-y-6">
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                <span class="text-sm font-bold text-slate-200">E-Book Store (Cloud Live Sync)</span>
                <button onclick="loadBooks(); alert('Books refreshed successfully!');" class="px-3 py-1.5 bg-indigo-600/20 text-indigo-300 hover:bg-indigo-600/30 rounded-xl text-xs font-bold border border-indigo-500/30 flex items-center gap-1">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh Books
                </button>
            </div>

            <div id="customer-books-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <!-- PAYMENT MODAL -->
        <div id="payment-modal" class="hidden fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50">
            <div class="bg-slate-900 border border-slate-800 max-w-sm w-full p-6 rounded-3xl space-y-4 text-center">
                <i data-lucide="lock" class="w-12 h-12 text-amber-400 mx-auto"></i>
                <h3 id="pay-book-title" class="text-lg font-bold text-white"></h3>
                <div class="text-3xl font-extrabold text-emerald-400" id="pay-book-price"></div>

                <p class="text-xs text-slate-400">Step 1: Pay the amount via PhonePe or GPay.</p>
                <button onclick="openPhonePeApp()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                    <i data-lucide="smartphone" class="w-4 h-4"></i> Open PhonePe / Pay Now
                </button>

                <div class="border-t border-slate-800 pt-3 text-left space-y-2">
                    <label class="block text-[11px] font-bold text-slate-300">Step 2: Enter 12-Digit UTR Number:</label>
                    <input type="text" id="utr-number" placeholder="Enter 12-digit UTR..." class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white">
                    <button onclick="verifyAndUnlock()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold">
                        Verify & Unlock (30 Days)
                    </button>
                </div>

                <button onclick="closePayModal()" class="w-full py-2 bg-slate-800 text-slate-400 rounded-xl text-xs">Cancel</button>
            </div>
        </div>

        <!-- READER MODAL -->
        <div id="reader-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-50">
            <div class="bg-slate-900 border border-slate-800 max-w-2xl w-full p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 id="reader-title" class="text-lg font-bold text-indigo-400"></h3>
                    <button onclick="closeReaderModal()" class="p-2 bg-slate-800 rounded-xl text-xs">✕ Close</button>
                </div>

                <div class="bg-slate-950 p-4 rounded-2xl max-h-60 overflow-y-auto">
                    <p id="reader-content-text" class="text-sm text-slate-300 leading-relaxed whitespace-pre-line no-select"></p>
                </div>

                <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <button onclick="toggleAudio()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Play / Pause Audio</button>
                    <span id="audio-status" class="text-xs text-slate-400">Audio Ready</span>
                </div>
            </div>
        </div>

    </main>

    <script>
        const ownerEmailCred = "jayashankar9381@gmail.com";
        const ownerPassCred = "9381198260";

        let books = [];
        let userPurchases = JSON.parse(localStorage.getItem('user_purchases')) || {};
        let selectedBookForPay = null;
        let selectedBookForRead = null;
        let currentUploadedImageBase64 = "";

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadBooks();
            setupImageFileInput();
            setupSecurity();
        });

        function setupSecurity() {
            document.addEventListener('keyup', (e) => {
                if (e.key === 'PrintScreen') {
                    navigator.clipboard.writeText('');
                    alert('Security Notice: Screenshot prohibited!');
                }
            });
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's' || e.key === 'u')) {
                    e.preventDefault();
                    alert('Security Notice: Action blocked!');
                }
            });
        }

        function loadBooks() {
            const cloudData = localStorage.getItem('global_cloud_books_store');
            if (cloudData) {
                books = JSON.parse(cloudData);
            } else {
                books = [
                    {
                        id: 1,
                        title: "AI Future Stories 2026",
                        price: 199,
                        image: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500",
                        upiId: "jayashankar9381@ybl",
                        content: "This is a book about the future of AI technology. It unlocks for 30 days after payment verification.",
                        readersCount: 0
                    }
                ];
                localStorage.setItem('global_cloud_books_store', JSON.stringify(books));
            }
            renderCustomerBooks();
        }

        function syncBooksToCloud() {
            localStorage.setItem('global_cloud_books_store', JSON.stringify(books));
        }

        function setupImageFileInput() {
            const input = document.getElementById('book-image-file');
            if(input) {
                input.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (evt) => currentUploadedImageBase64 = evt.target.result;
                        reader.readAsDataURL(file);
                    }
                });
            }
        }

        function showCustomerView() {
            window.speechSynthesis.cancel();
            document.getElementById('owner-login-view').classList.add('hidden');
            document.getElementById('owner-dashboard-view').classList.add('hidden');
            document.getElementById('customer-store-view').classList.remove('hidden');
            loadBooks();
        }

        function showOwnerLogin() {
            window.speechSynthesis.cancel();
            document.getElementById('owner-email').value = "";
            document.getElementById('owner-pass').value = "";
            document.getElementById('customer-store-view').classList.add('hidden');
            document.getElementById('owner-dashboard-view').classList.add('hidden');
            document.getElementById('owner-login-view').classList.remove('hidden');
        }

        function handleOwnerLogin() {
            const email = document.getElementById('owner-email').value.trim();
            const pass = document.getElementById('owner-pass').value.trim();

            if(email === ownerEmailCred && pass === ownerPassCred) {
                document.getElementById('owner-login-view').classList.add('hidden');
                document.getElementById('owner-dashboard-view').classList.remove('hidden');
                renderOwnerBooks();
            } else {
                alert("Invalid Credentials!");
            }
        }

        function saveBook() {
            const title = document.getElementById('book-title').value.trim();
            const price = document.getElementById('book-price').value;
            const upiId = document.getElementById('book-upi-id').value.trim() || "jayashankar9381@ybl";
            const content = document.getElementById('book-content').value.trim();

            if(!title || !price || !content) return alert("Please fill title, price and content!");

            const newBook = {
                id: Date.now(),
                title,
                price,
                image: currentUploadedImageBase64 || "https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500",
                upiId,
                content,
                readersCount: 0
            };

            loadBooks();
            books.push(newBook);
            syncBooksToCloud();
            resetForm();
            renderOwnerBooks();
            alert("Book published successfully! Now visible to all customers.");
        }

        function deleteBook(bookId) {
            if(confirm("Are you sure you want to delete this book?")) {
                loadBooks();
                books = books.filter(b => b.id !== bookId);
                syncBooksToCloud();
                renderOwnerBooks();
                alert("Book deleted successfully.");
            }
        }

        function resetForm() {
            document.getElementById('book-title').value = "";
            document.getElementById('book-price').value = "";
            document.getElementById('book-content').value = "";
            document.getElementById('book-image-file').value = "";
            currentUploadedImageBase64 = "";
        }

        function renderOwnerBooks() {
            loadBooks();
            const list = document.getElementById('owner-books-list');
            list.innerHTML = "";
            if(books.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-500">No books available.</p>`;
                return;
            }
            books.forEach(b => {
                list.innerHTML += `
                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex gap-3 items-center justify-between">
                        <div class="flex gap-3 items-center">
                            <img src="${b.image}" class="w-16 h-20 object-cover rounded-lg border border-slate-800">
                            <div>
                                <h4 class="text-indigo-400 font-bold text-sm">${b.title}</h4>
                                <p class="text-emerald-400 text-xs font-bold">₹${b.price}</p>
                                <p class="text-[11px] text-slate-400 mt-1">📚 Readers: <b class="text-white">${b.readersCount || 0}</b></p>
                            </div>
                        </div>
                        <button onclick="deleteBook(${b.id})" class="px-3 py-1.5 bg-red-500/20 text-red-400 text-xs font-bold rounded-lg border border-red-500/30">Delete</button>
                    </div>
                `;
            });
        }

        function isBookAccessActive(bookId) {
            const expiry = userPurchases[bookId];
            return expiry && Date.now() < expiry;
        }

        function renderCustomerBooks() {
            const grid = document.getElementById('customer-books-grid');
            grid.innerHTML = "";
            if(books.length === 0) {
                grid.innerHTML = `<p class="text-xs text-slate-400">No books available at the moment.</p>`;
                return;
            }
            books.forEach(b => {
                const hasAccess = isBookAccessActive(b.id);
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-3xl space-y-3 shadow-lg flex flex-col justify-between">
                        <div class="space-y-3">
                            <img src="${b.image}" class="w-full h-44 object-cover rounded-2xl border border-slate-800">
                            <div class="flex justify-between items-start">
                                <h4 class="font-bold text-white text-base">${b.title}</h4>
                                <span class="text-emerald-400 font-bold text-sm">₹${b.price}</span>
                            </div>
                            <p class="text-[11px] text-slate-400">👥 Readers: <b class="text-indigo-400">${b.readersCount || 0}</b></p>
                        </div>

                        ${hasAccess ? `
                            <button onclick="openUnlockedBook(${b.id})" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/30">Read / Listen (30 Days Active)</button>
                        ` : `
                            <button onclick="openPayModal(${b.id})" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/30">Buy Now (₹${b.price})</button>
                        `}
                    </div>
                `;
            });
        }

        function openPayModal(bookId) {
            selectedBookForPay = books.find(b => b.id === bookId);
            document.getElementById('pay-book-title').innerText = selectedBookForPay.title;
            document.getElementById('pay-book-price').innerText = `₹${selectedBookForPay.price}`;
            document.getElementById('payment-modal').classList.remove('hidden');
        }

        function closePayModal() { document.getElementById('payment-modal').classList.add('hidden'); }

        function openPhonePeApp() {
            const upiUrl = `upi://pay?pa=${selectedBookForPay.upiId}&pn=Owner&am=${selectedBookForPay.price}&cu=INR`;
            window.location.href = upiUrl;
        }

        function verifyAndUnlock() {
            const utr = document.getElementById('utr-number').value.trim();
            if(!utr || utr.length < 10) {
                alert("Please enter a valid 12-digit UTR number!");
                return;
            }

            const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
            userPurchases[selectedBookForPay.id] = Date.now() + thirtyDaysMs;
            localStorage.setItem('user_purchases', JSON.stringify(userPurchases));

            loadBooks();
            const targetBook = books.find(b => b.id === selectedBookForPay.id);
            if(targetBook) {
                targetBook.readersCount = (targetBook.readersCount || 0) + 1;
                syncBooksToCloud();
            }

            alert("Payment verified successfully! 30 days access unlocked.");
            closePayModal();
            renderCustomerBooks();
            openUnlockedBook(selectedBookForPay.id);
        }

        function openUnlockedBook(bookId) {
            loadBooks();
            if (!isBookAccessActive(bookId)) {
                alert("Please complete the payment and enter the UTR number first!");
                openPayModal(bookId);
                return;
            }

            const book = books.find(b => b.id === bookId);
            selectedBookForRead = book;
            document.getElementById('reader-title').innerText = book.title;
            document.getElementById('reader-content-text').innerText = book.content;
            document.getElementById('reader-modal').classList.remove('hidden');
        }

        closeReaderModal = function() {
            window.speechSynthesis.cancel();
            document.getElementById('reader-modal').classList.add('hidden');
        }

        function toggleAudio() {
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                document.getElementById('audio-status').innerText = "Audio Paused";
            } else {
                const utterance = new SpeechSynthesisUtterance(selectedBookForRead.content);
                utterance.lang = "en-US";
                window.speechSynthesis.speak(utterance);
                document.getElementById('audio-status').innerText = "Playing Audio...";
            }
        }
    </script>
</body>
</html>
