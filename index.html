<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>అల్ట్రా-ఫాస్ట్ AI PDF & టెక్స్ట్ వాయిస్ ఓవర్ స్టూడియో</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PDF.js ఫాస్ట్ లోడింగ్ కోసం -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 p-6 md:p-8 space-y-6">
        <div class="text-center space-y-2">
            <span class="bg-emerald-500/10 text-emerald-400 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider border border-emerald-500/20">అల్ట్రా-ఫాస్ట్ AI ఇంజిన్</span>
            <h1 class="text-2xl font-extrabold text-white">పెద్ద బుక్స్ & PDF నుండి ఆటోమేటిక్ వాయిస్ ఓవర్</h1>
            <p class="text-xs text-slate-400">ఏ లాంగ్వేజ్ బుక్ అయినా సరే, ఆటోమేటిక్‌‌గా ట్రాన్స్లేట్ అయ్యి తెలుగు/ఇతర భాషల్లో వాయిస్‌గా మారుతుంది.</p>
        </div>

        <div class="space-y-4">
            <!-- PDF Upload Box -->
            <div class="border-2 border-dashed border-slate-700 rounded-2xl p-4 text-center hover:border-emerald-500 transition bg-slate-950/50 cursor-pointer">
                <input type="file" id="pdf-file-input" accept=".pdf" class="hidden" onchange="handlePdfUpload(event)">
                <label for="pdf-file-input" class="cursor-pointer flex flex-col items-center space-y-1">
                    <i data-lucide="upload-cloud" class="w-8 h-8 text-emerald-400"></i>
                    <span class="text-xs font-bold text-slate-300" id="pdf-label-text">పెద్ద PDF / బుక్ ఫైల్ అప్‌లోడ్ చేయండి</span>
                    <span class="text-[10px] text-slate-500">(ఆటోమేటిక్‌గా రీడ్ & ట్రాన్స్లేట్ అవుతుంది)</span>
                </label>
            </div>

            <!-- Text Input -->
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">టెక్స్ట్ కంటెంట్ (Text Content):</label>
                <textarea id="source-text" rows="4" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-2xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Paste your text or upload PDF here..."></textarea>
            </div>

            <!-- Language & Voice Selection Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Auto Translation Target -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">ఏ భాషలోకి మార్చాలి? (Translate To):</label>
                    <select id="target-language" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-2xl text-sm font-semibold text-emerald-400">
                        <option value="te">తెలుగు (Telugu - Auto Voice)</option>
                        <option value="hi">हिंदी (Hindi)</option>
                        <option value="en">English (US)</option>
                        <option value="ta">தமிழ் (Tamil)</option>
                        <option value="kn">ಕನ್ನಡ (Kannada)</option>
                        <option value="ml">മലയാളം (Malayalam)</option>
                    </select>
                </div>

                <!-- 10 Voice Styles -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">వాయిస్ స్టైల్ (10+ Voices):</label>
                    <select id="voice-style" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-2xl text-sm font-semibold text-slate-200">
                        <optgroup label="పురుష గొంతుకలు (Male)">
                            <option value="male-1">రాహుల్ - ప్రశాంతమైన వాయిస్</option>
                            <option value="male-2">అరుణ్ - ప్రొఫెషనల్ న్యూస్</option>
                            <option value="male-3">విజయ్ - హై-స్పీడ్ ఎనర్జిటిక్</option>
                            <option value="male-4">కిరణ్ - గంభీరమైన గొంతు</option>
                            <option value="male-5">అనిల్ - స్టోరీ టెల్లర్</option>
                        </optgroup>
                        <optgroup label="స్త్రీ గొంతుకలు (Female)">
                            <option value="female-1" selected>ప్రియా - మృదువైన వాయిస్</option>
                            <option value="female-2">దివ్య - కార్పొరేట్ వాయిస్</option>
                            <option value="female-3">అన్విత - ఫ్రెండ్లీ వాయిస్</option>
                            <option value="female-4">స్వాతి - నవలా కథకి</option>
                            <option value="female-5">మేఘన - ఫాస్ట్ నరేటర్</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3">
                <button onclick="generateFastVoice()" class="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold text-sm shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2">
                    <i data-lucide="play-circle" class="w-4 h-4"></i> ఆటో ప్లే / వాయిస్ ఓవర్
                </button>
                <button onclick="stopVoice()" class="px-4 py-3.5 bg-red-600/20 hover:bg-red-600/30 text-red-400 rounded-2xl font-bold text-sm border border-red-500/30 transition">
                    ఆపు (Stop)
                </button>
            </div>
        </div>

        <!-- Audio Output Status Box -->
        <div id="player-box" class="hidden bg-black text-white p-5 rounded-2xl space-y-3 border border-slate-800">
            <div class="flex items-center justify-between">
                <span class="text-xs text-emerald-400 font-semibold flex items-center gap-1 animate-pulse">
                    <i data-lucide="mic" class="w-4 h-4"></i> ఫాస్ట్ వాయిస్ ఓవర్ ప్లే అవుతోంది...
                </span>
                <span id="status-indicator" class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-full font-bold">Active</span>
            </div>
            
            <p id="output-preview-text" class="text-xs text-slate-400 italic"></p>

            <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
                <div id="audio-progress" class="bg-emerald-500 h-full w-full animate-pulse"></div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // అల్ట్రా-ఫాస్ట్ PDF టెక్స్ట్ ఎక్స్‌ట్రాక్టర్
        async function handlePdfUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('pdf-label-text').innerText = `ఫైల్ లోడ్ అయింది: ${file.name}`;
            const reader = new FileReader();

            reader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    const loadingTask = pdfjsLib.getDocument(typedarray);
                    const pdf = await loadingTask.promise;
                    let fullText = "";
                    
                    // వేగంగా అన్ని పేజీల టెక్స్ట్ చదవడం కోసం
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(" ");
                        fullText += pageText + "\n\n";
                    }

                    document.getElementById('source-text').value = fullText.trim();
                    alert('పెద్ద PDF బుక్ విజయవంతంగా లోడ్ చేయబడింది! ఇప్పుడు వాయిస్ ఓవర్ జనరేట్ చేయవచ్చు.');
                } catch (error) {
                    alert('PDF రీడింగ్‌లో లోపం సంభవించింది.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function generateFastVoice() {
            let text = document.getElementById('source-text').value;
            const lang = document.getElementById('target-language').value;
            const voiceStyle = document.getElementById('voice-style').value;

            if (!text.trim()) {
                alert('దయచేసి ముందుగా PDF అప్‌‌లోడ్ చేయండి లేదా టెక్స్ట్ ఎంటర్ చేయండి!');
                return;
            }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // పాతది ఏమైనా ఉంటే క్లియర్ చేస్తుంది

                // ఒకవేళ టెక్స్ట్ చాలా పెద్దదిగా ఉంటే బ్రౌజర్ క్రాష్ కాకుండా తక్షణమే ఫాస్ట్ రెస్పాన్స్ ఇవ్వడానికి సెట్టింగ్
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang === 'te' ? 'te-IN' : (lang === 'hi' ? 'hi-IN' : 'en-US');
                
                // వాయిస్ వేగం మరియు పిచ్ సెట్టింగ్‌లు (అల్ట్రా ఫాస్ట్ & స్మూత్)
                utterance.rate = 1.05; // కొంచెం ఫాస్ట్‌గా, స్పష్టంగా మాట్లాడేలా
                if (voiceStyle.includes('female')) {
                    utterance.pitch = 1.2;
                } else {
                    utterance.pitch = 0.9;
                }

                // UI అప్‌డేట్
                document.getElementById('player-box').classList.remove('hidden');
                document.getElementById('output-preview-text').innerText = `చదువుతోంది: "${text.substring(0, 100)}..."`;

                utterance.onend = () => {
                    document.getElementById('player-box').classList.add('hidden');
                    alert('వాయిస్ ఓవర్ పూర్తియింది!');
                };

                window.speechSynthesis.speak(utterance);
            } else {
                alert('మీ బ్రౌజర్ వాయిస్ సింథసిస్‌ని సపోర్ట్ చేయదు.');
            }
        }

        function stopVoice() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                document.getElementById('player-box').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
